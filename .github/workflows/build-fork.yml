name: Build Fork APK

on:
  workflow_dispatch:
  push:
    branches: [canary]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare persistent signing key
        env:
          PIXELXPERT_SIGNING_KEY_BASE64: ${{ secrets.PIXELXPERT_SIGNING_KEY_BASE64 }}
          PIXELXPERT_SIGNING_STORE_PASSWORD: ${{ secrets.PIXELXPERT_SIGNING_STORE_PASSWORD }}
          PIXELXPERT_SIGNING_KEY_PASSWORD: ${{ secrets.PIXELXPERT_SIGNING_KEY_PASSWORD }}
          PIXELXPERT_SIGNING_KEY_ALIAS: ${{ secrets.PIXELXPERT_SIGNING_KEY_ALIAS }}
        run: bash .github/prepareSigningKey.sh

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: PixelXpert-fork-debug
          path: app/build/outputs/apk/debug/*.apk
