name: Canary CI

on:
  workflow_dispatch:
  pull_request:
    branches: [canary]
  push:
    branches: [canary]

jobs:
  static-module-guards:
    name: static module guards
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Check shell scripts
        run: |
          bash -n MagiskModBase/customize.sh
          bash -n MagiskModBase/service.sh
          bash -n .github/*.sh

      - name: Guard rollback marker
        run: |
          if grep -En 'rm[[:space:]][^#[:cntrl:]]*disable' MagiskModBase/*.sh; then
            echo "Module scripts must not remove the durable disable rollback marker"
            exit 1
          fi

      - name: Guard canonical owner URLs
        run: |
          if git grep -n 'lars[-]martens' -- .; then
            echo "Found stale project-owned URL for the retired owner"
            exit 1
          fi

      - name: Guard fork checkout source
        run: |
          if git grep -n 'git[[:space:]]clone[[:space:]]https://github[.]com/siavash79/PixelXpert' -- .github/workflows; then
            echo "Fork workflows must build the checked-out fork/ref, not clone upstream"
            exit 1
          fi

  gradle:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: assembleDebug
            command: ./gradlew assembleDebug
          - name: assembleRelease
            command: ./gradlew assembleRelease
          - name: lint
            command: ./gradlew lint
          - name: dependency validation
            command: ./gradlew app:dependencies --configuration debugRuntimeClasspath

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Prepare Gradle
        run: chmod +x gradlew

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}

  zip-integrity:
    name: zip integrity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Generate module zip
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/PixelXpert.apk MagiskModBase/system/priv-app/PixelXpert/PixelXpert.apk
          (cd MagiskModBase && zip -r ../output/PixelXpert.zip *)

      - name: Validate module zip
        run: |
          unzip -t output/PixelXpert.zip
          unzip -l output/PixelXpert.zip | tee zip-contents.txt
          grep -q 'customize.sh' zip-contents.txt
          grep -q 'service.sh' zip-contents.txt
          grep -q 'module.prop' zip-contents.txt
          grep -q 'system/priv-app/PixelXpert/PixelXpert.apk' zip-contents.txt

      - name: Upload module zip
        uses: actions/upload-artifact@v7
        with:
          name: PixelXpert-zip-integrity
          path: output/PixelXpert.zip
