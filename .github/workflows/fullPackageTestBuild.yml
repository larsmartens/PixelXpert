name: Make Test Package

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Prepare build scripts
        run: |
          chmod +x gradlew
          chmod +x .github/*.sh

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Generate module zip
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/PixelXpert.apk MagiskModBase/system/priv-app/PixelXpert/PixelXpert.apk
          (cd MagiskModBase && zip -r ../output/PixelXpert.zip *)

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: PixelXpert.apk
          path: app/build/outputs/apk/debug/PixelXpert.apk

      - name: Upload module zip
        uses: actions/upload-artifact@v7
        with:
          name: PixelXpert.zip
          path: output/PixelXpert.zip
