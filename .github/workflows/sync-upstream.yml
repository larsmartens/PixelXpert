name: Sync Upstream and Release

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 06:00 UTC
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/siavash79/PixelXpert.git || true

      - name: Fetch upstream
        run: git fetch upstream canary

      - name: Check for new upstream commits
        id: check
        run: |
          BEHIND=$(git rev-list HEAD..upstream/canary --count)
          echo "behind=$BEHIND" >> $GITHUB_OUTPUT
          echo "Upstream is $BEHIND commits ahead"

      - name: Merge upstream
        if: steps.check.outputs.behind != '0'
        run: |
          # Merge upstream, keeping our changes on conflict
          git merge upstream/canary --no-edit -X ours || {
            echo "Merge had conflicts, resolving with ours strategy"
            git checkout --ours .
            git add .
            git commit --no-edit
          }

      - name: Re-apply fork URL overrides
        if: steps.check.outputs.behind != '0'
        run: |
          # Ensure our fork URLs are always correct after merge
          # UpdateFragment.java
          sed -i 's|raw.githubusercontent.com/siavash79/PixelXpert|raw.githubusercontent.com/lars-martens/PixelXpert-fork|g' \
            app/src/main/java/sh/siava/pixelxpert/ui/fragments/UpdateFragment.java

          # module.prop
          sed -i 's|raw.githubusercontent.com/siavash79/PixelXpert|raw.githubusercontent.com/lars-martens/PixelXpert-fork|g' \
            MagiskModBase/module.prop

          # All JSON update manifests
          for f in latestCanary.json latestVersion.json MagiskModuleUpdate_Xposed.json MagiskModuleUpdate_Full.json; do
            if [ -f "$f" ]; then
              sed -i 's|siavash79/PixelXpert|lars-martens/PixelXpert-fork|g' "$f"
            fi
          done

          # Commit URL fixups if anything changed
          if ! git diff --quiet; then
            git add -A
            git commit -m "fix: re-apply fork URL overrides after upstream merge"
          fi

      - name: Push
        if: steps.check.outputs.behind != '0'
        run: git push origin canary

      - name: Setup JDK 17
        if: steps.check.outputs.behind != '0'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant permissions
        if: steps.check.outputs.behind != '0'
        run: |
          chmod +x gradlew
          chmod +x .github/*.sh

      - name: Bump version
        if: steps.check.outputs.behind != '0'
        run: .github/bumpVersion.sh ${{ github.run_id }}

      - name: Build release APK
        if: steps.check.outputs.behind != '0'
        run: ./gradlew assembleDebug

      - name: Generate Magisk module zip
        if: steps.check.outputs.behind != '0'
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/PixelXpert.apk MagiskModBase/system/priv-app/PixelXpert/PixelXpert.apk
          cd MagiskModBase
          zip -r ../output/PixelXpert.zip *

      - name: Ensure fork URLs in bumped manifests
        if: steps.check.outputs.behind != '0'
        run: |
          for f in latestCanary.json latestVersion.json MagiskModuleUpdate_Xposed.json MagiskModuleUpdate_Full.json; do
            if [ -f "$f" ]; then
              sed -i 's|siavash79/PixelXpert|lars-martens/PixelXpert-fork|g' "$f"
            fi
          done
          sed -i 's|raw.githubusercontent.com/siavash79/PixelXpert|raw.githubusercontent.com/lars-martens/PixelXpert-fork|g' MagiskModBase/module.prop

      - name: Commit version bump
        if: steps.check.outputs.behind != '0'
        run: |
          git add -A
          git commit -m "Version update: Release (fork)" || true
          git push origin canary

      - name: Create/update release
        if: steps.check.outputs.behind != '0'
        uses: ncipollo/release-action@v1
        with:
          tag: 'canary_builds'
          name: 'Latest Canary (Fork)'
          prerelease: true
          allowUpdates: true
          replacesArtifacts: true
          draft: false
          artifacts: 'output/*.*'
          body: |
            Automated fork build with profile switch toggle patch.
            Synced from upstream siavash79/PixelXpert.
