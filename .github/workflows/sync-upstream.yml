name: Sync Upstream and Release

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 06:00 UTC
  workflow_dispatch:
  push:
    branches:
      - 'canary'
    paths-ignore:
      - 'MagiskModBase/module.prop'
      - 'app/build.gradle.kts'
      - 'latestVersion.json'
      - 'latestCanary.json'
      - 'MagiskModuleUpdate_Xposed.json'
      - 'MagiskModuleUpdate_Full.json'
      - 'CanaryChangelog.md'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/siavash79/PixelXpert.git || true

      - name: Fetch upstream
        run: git fetch upstream canary

      - name: Check for new upstream commits
        id: check
        run: |
          BEHIND=$(git rev-list HEAD..upstream/canary --count)
          echo "behind=$BEHIND" >> $GITHUB_OUTPUT
          echo "Upstream is $BEHIND commits ahead"

      - name: Decide whether to publish a release
        id: release
        run: |
          SHOULD_RELEASE=false
          REASON="no-op"

          if [ "${{ github.event_name }}" = "push" ]; then
            SHOULD_RELEASE=true
            REASON="fork-push"
          elif [ "${{ steps.check.outputs.behind }}" != "0" ]; then
            SHOULD_RELEASE=true
            REASON="upstream-sync"
          fi

          echo "should_release=$SHOULD_RELEASE" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"
          echo "Release decision: $SHOULD_RELEASE ($REASON)"

      - name: Capture fork baseline
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Merge upstream
        if: steps.check.outputs.behind != '0'
        run: |
          git merge upstream/canary --no-commit -X ours || {
            echo "Merge had conflicts, resolving with ours strategy"
            git checkout --ours .
            git add .
          }
          git restore --source="${{ steps.base.outputs.sha }}" --staged --worktree .github/workflows || true
          git commit --no-edit

      - name: Re-apply fork URL overrides
        if: steps.check.outputs.behind != '0'
        run: |
          # UpdateFragment.java - point to public updates repo
          sed -i 's|raw.githubusercontent.com/siavash79/PixelXpert/stable/latestStable.json|cdn.jsdelivr.net/gh/larsmartens/pixelxpert-updates@stable/latestStable.json|g' \
            app/src/main/java/sh/siava/pixelxpert/ui/fragments/UpdateFragment.java
          sed -i 's|raw.githubusercontent.com/siavash79/PixelXpert/canary/latestCanary.json|cdn.jsdelivr.net/gh/larsmartens/pixelxpert-updates@canary/latestCanary.json|g' \
            app/src/main/java/sh/siava/pixelxpert/ui/fragments/UpdateFragment.java

          # module.prop - point to public updates repo
          sed -i 's|raw.githubusercontent.com/siavash79/PixelXpert|cdn.jsdelivr.net/gh/larsmartens/pixelxpert-updates@canary|g' \
            MagiskModBase/module.prop

          # JSON manifests - fix changelog URLs to public updates repo, zipUrls to fork releases
          for f in latestCanary.json latestVersion.json MagiskModuleUpdate_Xposed.json MagiskModuleUpdate_Full.json; do
            if [ -f "$f" ]; then
              sed -i 's|raw.githubusercontent.com/siavash79/PixelXpert/stable/latestStable.json|cdn.jsdelivr.net/gh/larsmartens/pixelxpert-updates@stable/latestStable.json|g' "$f"
              sed -i 's|raw.githubusercontent.com/siavash79/PixelXpert/canary/latestCanary.json|cdn.jsdelivr.net/gh/larsmartens/pixelxpert-updates@canary/latestCanary.json|g' "$f"
              sed -i 's|raw.githubusercontent.com/siavash79/PixelXpert|cdn.jsdelivr.net/gh/larsmartens/pixelxpert-updates@canary|g' "$f"
              sed -i 's|github.com/siavash79/PixelXpert|github.com/larsmartens/PixelXpert-fork|g' "$f"
            fi
          done

          # Commit URL fixups if anything changed
          if ! git diff --quiet; then
            git add -A
            git commit -m "fix: re-apply fork URL overrides after upstream merge"
          fi

      - name: Push
        if: steps.check.outputs.behind != '0'
        run: git push origin canary

      - name: Setup JDK 17
        if: steps.release.outputs.should_release == 'true'
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant permissions
        if: steps.release.outputs.should_release == 'true'
        run: |
          chmod +x gradlew
          chmod +x .github/*.sh

      - name: Bump version
        if: steps.release.outputs.should_release == 'true'
        run: .github/bumpVersion.sh ${{ github.run_id }}

      - name: Build release APK
        if: steps.release.outputs.should_release == 'true'
        run: ./gradlew assembleDebug

      - name: Generate Magisk module zip
        if: steps.release.outputs.should_release == 'true'
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/PixelXpert.apk MagiskModBase/system/priv-app/PixelXpert/PixelXpert.apk
          cd MagiskModBase
          zip -r ../output/PixelXpert.zip *

      - name: Ensure fork URLs in bumped manifests
        if: steps.release.outputs.should_release == 'true'
        run: |
          for f in latestCanary.json latestVersion.json MagiskModuleUpdate_Xposed.json MagiskModuleUpdate_Full.json; do
            if [ -f "$f" ]; then
              sed -i 's|raw.githubusercontent.com/siavash79/PixelXpert/stable/latestStable.json|cdn.jsdelivr.net/gh/larsmartens/pixelxpert-updates@stable/latestStable.json|g' "$f"
              sed -i 's|raw.githubusercontent.com/siavash79/PixelXpert/canary/latestCanary.json|cdn.jsdelivr.net/gh/larsmartens/pixelxpert-updates@canary/latestCanary.json|g' "$f"
              sed -i 's|raw.githubusercontent.com/siavash79/PixelXpert|cdn.jsdelivr.net/gh/larsmartens/pixelxpert-updates@canary|g' "$f"
              sed -i 's|github.com/siavash79/PixelXpert|github.com/larsmartens/PixelXpert-fork|g' "$f"
            fi
          done
          sed -i 's|raw.githubusercontent.com/siavash79/PixelXpert|cdn.jsdelivr.net/gh/larsmartens/pixelxpert-updates@canary|g' MagiskModBase/module.prop

      - name: Commit version bump
        if: steps.release.outputs.should_release == 'true'
        run: |
          git add -A
          git commit -m "Version update: Release (fork)" || true
          git push origin canary

      - name: Create/update release
        if: steps.release.outputs.should_release == 'true'
        uses: ncipollo/release-action@v1
        with:
          tag: 'canary_builds'
          name: 'Latest Canary (Fork)'
          prerelease: true
          allowUpdates: true
          replacesArtifacts: true
          draft: false
          artifacts: 'output/*.*'
          body: |
            Automated fork build.
            Release reason: ${{ steps.release.outputs.reason }}.

      - name: Sync manifests to public updates repo
        if: steps.release.outputs.should_release == 'true'
        env:
          UPDATES_REPO_TOKEN: ${{ secrets.UPDATES_REPO_TOKEN }}
        run: |
          if [ -z "${UPDATES_REPO_TOKEN}" ]; then
            echo "UPDATES_REPO_TOKEN is not configured"
            exit 1
          fi
          git clone https://x-access-token:${UPDATES_REPO_TOKEN}@github.com/larsmartens/pixelxpert-updates.git /tmp/updates
          cd /tmp/updates
          git checkout canary
          cp $GITHUB_WORKSPACE/latestCanary.json .
          cp $GITHUB_WORKSPACE/MagiskModuleUpdate_Xposed.json .
          cp $GITHUB_WORKSPACE/MagiskModuleUpdate_Full.json .
          cp $GITHUB_WORKSPACE/CanaryChangelog.md .
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "sync: update manifests from fork build"
          git push origin canary
